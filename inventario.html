<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

:root{
    --azul:#0b7cff;
    --verde:#16a34a;
    --rojo:#ef4444;
    --fondo:#f3f6fb;
    --texto:#0f172a;
    --gris:#64748b;
    --linea:#e5e7eb;
}

body{
    background:var(--fondo);
    color:var(--texto);
    overflow:hidden;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:75px;
    background:#fff;
    border-bottom:1px solid var(--linea);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    z-index:1000;
}

.header-left{
    display:flex;
    align-items:center;
    gap:18px;
}

.header-left i{
    font-size:25px;
}

.header h1{
    font-size:28px;
}

.user{
    display:flex;
    align-items:center;
    gap:12px;
}

.user img{
    width:45px;
    height:45px;
    border-radius:50%;
}

.user small{
    color:var(--gris);
}

.sidebar{
    position:fixed;
    top:75px;
    left:0;
    bottom:0;
    width:230px;
    background:white;
    border-right:1px solid var(--linea);
    padding:22px 12px;
    z-index:900;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 15px;
    border-radius:12px;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:#334155;
    cursor:pointer;
    transition:.2s;
}

.menu-item:hover{
    background:#eef5ff;
    color:var(--azul);
}

.menu-item i{
    font-size:18px;
    width:22px;
}

.menu-item.active{
    background:var(--azul);
    color:white;
    box-shadow:0 8px 16px rgba(11,124,255,.22);
}

.config-separator{
    margin-top:35px;
    border-top:1px solid var(--linea);
    padding-top:15px;
}

.content{
    position:fixed;
    top:75px;
    left:230px;
    right:0;
    bottom:0;
    overflow-y:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:15px;
}

.top h2{
    font-size:34px;
}

.search-box{
    height:56px;
    width:360px;
    border:1px solid var(--linea);
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
}

.search-box input{
    width:100%;
    height:100%;
    border:none;
    outline:none;
    font-size:17px;
}

.search-box i{
    color:var(--gris);
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:28px;
}

.stat{
    border:1px solid var(--linea);
    border-radius:18px;
    padding:22px;
    background:#fff;
}

.stat h3{
    font-size:16px;
    color:#334155;
    margin-bottom:14px;
}

.stat b{
    font-size:30px;
    color:var(--azul);
}

.stat.green b{
    color:var(--verde);
}

.stat.red b{
    color:var(--rojo);
}

.table{
    width:100%;
}

.header-row,
.product-row{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1fr;
    gap:15px;
    align-items:center;
}

.header-row{
    padding:18px 0;
    border-bottom:1px solid var(--linea);
    font-size:16px;
    font-weight:bold;
}

.product-row{
    min-height:76px;
    border-bottom:1px solid #f1f5f9;
    font-size:15px;
    font-weight:bold;
    color:#475569;
}

.stock-ok{
    color:var(--verde);
}

.stock-low{
    color:var(--rojo);
}

.empty{
    padding:30px;
    font-size:18px;
    font-weight:bold;
    color:#64748b;
    text-align:center;
}

@media(max-width:1000px){
    .sidebar{
        width:82px;
    }

    .menu-item{
        justify-content:center;
        padding:16px 8px;
    }

    .menu-item span{
        display:none;
    }

    .content{
        left:82px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        overflow-x:auto;
    }

    .top,
    .stats,
    .table{
        min-width:950px;
    }
}

@media(max-width:650px){
    .header{
        height:65px;
        padding:0 12px;
    }

    .header h1{
        font-size:20px;
    }

    .user{
        display:none;
    }

    .sidebar{
        top:65px;
    }

    .content{
        top:65px;
        padding:14px;
    }

    .top h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <i class="fa-solid fa-bars"></i>
        <h1>Inventario</h1>
    </div>
</header>

<aside class="sidebar">
    <div class="menu-item" onclick="location.href='nueva_venta.html'">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Nueva venta</span>
    </div>

    <div class="menu-item" onclick="location.href='dashboard.html'">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </div>

    <div class="menu-item" onclick="location.href='productos.html'">
        <i class="fa-solid fa-box"></i>
        <span>Productos</span>
    </div>

    <div class="menu-item active" onclick="location.href='inventario.html'">
        <i class="fa-solid fa-warehouse"></i>
        <span>Inventario</span>
    </div>

    <div class="menu-item" onclick="location.href='clientes.html'">
        <i class="fa-solid fa-users"></i>
        <span>Clientes</span>
    </div>

    <div class="menu-item" onclick="location.href='ventas.html'">
        <i class="fa-solid fa-receipt"></i>
        <span>Ventas</span>
    </div>

    <div class="menu-item" onclick="location.href='cotizaciones.html'">
        <i class="fa-solid fa-file-lines"></i>
        <span>Cotizaciones</span>
    </div>

    <div class="menu-item" onclick="location.href='reportes.html'">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Reportes</span>
    </div>

    <div class="menu-item" onclick="location.href='gastos.html'">
        <i class="fa-solid fa-money-bill-wave"></i>
        <span>Gastos</span>
    </div>

    <div class="menu-item config-separator" onclick="location.href='configuracion.html'">
        <i class="fa-solid fa-gear"></i>
        <span>Configuración</span>
    </div>
</aside>

<main class="content">
    <div class="card">

        <div class="top">
            <h2>Inventario</h2>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscar" placeholder="Buscar producto, categoría o código">
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <h3>Total productos</h3>
                <b id="totalProductos">0</b>
            </div>

            <div class="stat green">
                <h3>Total costo inventario</h3>
                <b id="totalCostos">$0</b>
            </div>

            <div class="stat">
                <h3>Valor venta inventario</h3>
                <b id="totalVentas">$0</b>
            </div>

            <div class="stat red">
                <h3>Productos bajo stock</h3>
                <b id="bajoStock">0</b>
            </div>
        </div>

        <div class="table">
            <div class="header-row">
                <div>Producto</div>
                <div>Categoría</div>
                <div>Costo</div>
                <div>Precio</div>
                <div>Stock</div>
                <div>Total costo</div>
            </div>

            <div id="listaInventario"></div>
        </div>

    </div>
</main>

<script>
function formato(valor){
    return "$" + Number(valor || 0).toLocaleString("es-DO");
}

function leerProductos(){
    try{
        return JSON.parse(localStorage.getItem("productosPOS")) || [];
    }catch(e){
        return [];
    }
}

let productos = leerProductos().map(p => ({
    ...p,
    nombre:p.nombre || "",
    categoria:p.categoria || "Sin categoría",
    costo:Number(p.costo || 0),
    precio:Number(p.precio || 0),
    stock:Number(p.stock || 0),
    codigo:p.codigo || ""
}));

function calcularResumen(lista = productos){
    const totalProductos = lista.length;
    const totalCostos = lista.reduce((s,p)=>s + (p.costo * p.stock),0);
    const totalVentas = lista.reduce((s,p)=>s + (p.precio * p.stock),0);
    const bajoStock = lista.filter(p=>p.stock <= 5).length;

    document.getElementById("totalProductos").innerText = totalProductos;
    document.getElementById("totalCostos").innerText = formato(totalCostos);
    document.getElementById("totalVentas").innerText = formato(totalVentas);
    document.getElementById("bajoStock").innerText = bajoStock;
}

function mostrarInventario(lista = productos){
    const contenedor = document.getElementById("listaInventario");
    contenedor.innerHTML = "";

    if(lista.length === 0){
        contenedor.innerHTML = `
            <div class="empty">
                No hay productos en el inventario.
            </div>
        `;
        calcularResumen(lista);
        return;
    }

    lista.forEach(p=>{
        const stockClass = p.stock <= 5 ? "stock-low" : "stock-ok";

        contenedor.innerHTML += `
            <div class="product-row">
                <div>${p.nombre}</div>
                <div>${p.categoria || "Sin categoría"}</div>
                <div>${formato(p.costo)}</div>
                <div>${formato(p.precio)}</div>
                <div class="${stockClass}">${p.stock}</div>
                <div>${formato(p.costo * p.stock)}</div>
            </div>
        `;
    });

    calcularResumen(lista);
}

function aplicarBusqueda(){
    const texto = document.getElementById("buscar").value.toLowerCase();

    const filtrados = productos.filter(p =>
        String(p.nombre).toLowerCase().includes(texto) ||
        String(p.categoria).toLowerCase().includes(texto) ||
        String(p.codigo).toLowerCase().includes(texto)
    );

    mostrarInventario(filtrados);
}

document.getElementById("buscar").addEventListener("input", aplicarBusqueda);

mostrarInventario();
</script>

</body>
</html>
